services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cherryshare
      POSTGRES_USER: cherryshare
      POSTGRES_PASSWORD: cherryshare-dev
    ports:
      - "5432:5432"
    volumes:
      - cherryshare-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cherryshare -d cherryshare"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - cherryshare-redis:/data

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cherryshare
      MINIO_ROOT_PASSWORD: cherryshare-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cherryshare-minio:/data

volumes:
  cherryshare-postgres:
  cherryshare-redis:
  cherryshare-minio:
