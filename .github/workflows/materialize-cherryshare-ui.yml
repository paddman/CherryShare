name: Materialize CherryShare UI

on:
  push:
    paths:
      - ".github/workflows/materialize-cherryshare-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified UI source archive
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d .bootstrap ]; then
            echo "UI source is already materialized."
            exit 0
          fi

          cat \
            .bootstrap/cherryshare-ui.part-00.b64 \
            .bootstrap/fix1/part-* \
            .bootstrap/cherryshare-ui.part-02.b64 \
            .bootstrap/fix2/part-* \
            > /tmp/cherryshare-ui.b64

          echo "4d653be72653eb787352c370bdc2527ddb42e8fc1083c8e348be7ae2b868cf18  /tmp/cherryshare-ui.b64" | sha256sum -c -
          base64 --decode /tmp/cherryshare-ui.b64 > /tmp/cherryshare-ui.tgz
          echo "8127da50a543ed31f586d31b2c7786401a120412893d599781fd741f63acf1f3  /tmp/cherryshare-ui.tgz" | sha256sum -c -

          tar -xzf /tmp/cherryshare-ui.tgz
          rm -rf .bootstrap

      - name: Commit complete UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "feat: add complete responsive CherryShare web and mobile UI"
          git push
